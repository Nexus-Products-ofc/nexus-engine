name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - name: Prepare site folder
        run: |
          mkdir -p _site
          if [ -f docs/index.html ]; then
            cp docs/index.html _site/
            cp docs/styles.css _site/ 2>/dev/null || true
            cp docs/app.js _site/ 2>/dev/null || true
            cp -r docs/assets _site/ 2>/dev/null || true
            touch _site/.nojekyll
          else
            cp -r docs/website/* _site/
            touch _site/.nojekyll
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
